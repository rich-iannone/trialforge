[package]
name = "trialforge-python"
description = "Python bindings for trialforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
arrow-array = { version = "59", features = ["ffi"] }
pyo3 = { version = "0.29.3", features = ["abi3-py310", "extension-module"] }
serde_json = "1.0.154"
trialforge = { workspace = true, features = ["parquet"] }
