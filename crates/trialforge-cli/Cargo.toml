[package]
name = "trialforge-cli"
description = "Command-line interface for trialforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "trialforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
trialforge = { workspace = true, features = ["parquet"] }

[lints]
workspace = true
