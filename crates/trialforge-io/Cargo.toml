[package]
name = "trialforge-io"
description = "Writers for trialforge: Arrow, Parquet, XPT, Dataset-JSON, CSV, define.xml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
arrow-array = { version = "59", optional = true }
arrow-schema = { version = "59", optional = true }
parquet = { version = "59", optional = true, default-features = false, features = ["arrow"] }
trialforge-core.workspace = true
trialforge-cdisc.workspace = true
serde_json = "1.0.154"

[features]
# Dataset → Arrow conversion (used by the Python binding and the Parquet writer).
arrow = ["dep:arrow-array", "dep:arrow-schema"]
# Parquet writer. Off by default to keep the R package's vendored crates small.
parquet = ["arrow", "dep:parquet"]

[lints]
workspace = true
