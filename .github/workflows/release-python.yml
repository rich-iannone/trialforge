name: Release (Python)

# Publishes trialforge to PyPI on a version tag (`py-v0.1.0`, matching the workspace version in
# Cargo.toml), once the wheels and sdist have been built, tested and checked
# (`python-dist.yml`). To try all of that without publishing, run `dry-run-python.yml`. R
# releases are tagged `r-v0.1.0` after CRAN accepts them, with no workflow.
#
# Publishing uses a PyPI API token in the repository secret `PYPI_API_TOKEN`.

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  version:
    name: Check the tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "py-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi

  dist:
    needs: version
    uses: ./.github/workflows/python-dist.yml

  publish:
    name: Publish to PyPI
    needs: dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Attestations need trusted publishing, so they are off with a token.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: false
