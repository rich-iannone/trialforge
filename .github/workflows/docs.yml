name: Docs

# One GitHub Pages site serves both packages: the Great Docs site from python/docs/ at the root and
# the pkgdown site from r/ under r/. A deployment replaces the whole site, so a change to either
# package rebuilds both. The pages execute their code, so a change to the engine crates rebuilds
# them too.
#
# Path filters: a workflow runs only when files it depends on change. main has no required status
# checks, so a skipped workflow can't block a PR. If checks become required, replace these filters
# with an always-running gate job.
on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/**"
      - "r/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "python/**"
      - "r/**"
      - ".github/workflows/docs.yml"
  # Run by hand to refresh the site.
  workflow_dispatch:

# A newer push supersedes a PR's build, but a deployment from main always runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-python-docs:
    name: Build Python docs
    runs-on: ubuntu-latest
    # The Great Docs project (pyproject.toml, docs/great-docs.yml, docs/user_guide/) lives in python/.
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history for accurate page timestamps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      # An in-place (develop) build puts the compiled _core next to the source package, so the
      # reference's introspection and the pages' code import the same trialforge whichever comes
      # first on sys.path.
      - name: Install the package and docs dependencies
        run: |
          uv pip install "maturin>=1.8,<2" -r pyproject.toml --extra docs
          maturin develop --release --uv
          uv pip install "git+https://github.com/posit-dev/great-docs.git@main"
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      # `--jobs auto` renders pages in several Quarto processes at once, one per CPU.
      - name: Build docs
        run: great-docs build --jobs auto
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-docs-html
          path: python/docs/_site
          include-hidden-files: true

  build-r-docs:
    name: Build R docs
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: r/src/rust -> target
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # The package's dependencies only: pak would build the package itself away from the repo,
      # where its path dependency on crates/trialforge doesn't resolve.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::pkgdown
          needs: website
      - name: Install the package in place
        run: R CMD INSTALL --no-multiarch r
      # pkgdown builds from the installed copy. The site lands in r/docs.
      - name: Build docs
        run: pkgdown::build_site("r", new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-docs-html
          path: r/docs
          include-hidden-files: true

  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    needs: [build-python-docs, build-r-docs]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-docs-html
          path: site

      # The Python site's r/ holds a stand-in page for the navbar link. The pkgdown site replaces it.
      - name: Remove the R stand-in page
        run: rm -rf site/r

      - uses: actions/download-artifact@v4
        with:
          name: r-docs-html
          path: site/r

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
