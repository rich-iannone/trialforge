[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "trialforge"
description = "Synthetic CDISC clinical-trial data (SDTM, ADaM, define.xml) from declarative study specs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Richard Iannone", email = "riannone@me.com" }]
maintainers = [{ name = "Richard Iannone", email = "riannone@me.com" }]
dynamic = ["version"]
requires-python = ">=3.10"
keywords = ["cdisc", "sdtm", "adam", "clinical trials", "synthetic data", "simulation", "pharma"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pl = ["polars>=1.0"]
pd = ["pandas>=2.0", "pyarrow>=14"]
pa = ["pyarrow>=14"]
# Verification levels 3–4 and the TLF pack. Level 3 needs Pointblank's cdisc (lxml, for
# define.xml) and cdisc-core (pyreadstat, for XPT) extras.
verify = ["pointblank[cdisc,cdisc-core]>=1.1.1", "greenwood"]
tables = ["great-tables"]
# Executing the documentation site's pages (Great Docs itself installs from git; see the Makefile).
docs = [
    "jupyter",
    "nbclient",
    "nbformat",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "pointblank[cdisc,cdisc-core]>=1.1.1",
]
dev = [
    "maturin>=1.8,<2",
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "polars>=1.0",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyreadstat>=1.2",
    "pointblank>=1.1.1",
    "greenwood",
    "lxml",
    "xmlschema",
    "odmlib",
]

[project.urls]
Homepage = "https://github.com/rich-iannone/trialforge"
Documentation = "https://rich-iannone.github.io/trialforge/"
Repository = "https://github.com/rich-iannone/trialforge"
Issues = "https://github.com/rich-iannone/trialforge/issues"
Changelog = "https://github.com/rich-iannone/trialforge/blob/main/CHANGELOG.md"

[tool.maturin]
# The Python package is trialforge/, next to Cargo.toml; the extension module is trialforge._core.
module-name = "trialforge._core"
features = ["pyo3/extension-module"]
# Keep bytecode from a local development install out of wheels and the sdist, and the
# documentation site's sources out of the sdist.
exclude = [
    "trialforge/**/__pycache__/**",
    "trialforge/**/*.pyc",
    { path = "docs/**", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["trialforge"]

[tool.pyright]
include = ["trialforge", "tests"]
# Resolve `trialforge` to the source, not an installed wheel (CI tests the wheel).
extraPaths = ["."]
typeCheckingMode = "strict"
pythonVersion = "3.10"
# Keep strict, but relax the "unknown type" family (as greenwood does): they fire on interop
# with untyped scientific deps (pyarrow, pandas, pyreadstat ship no stubs). The valuable
# strict checks (missing annotations, type mismatches) stay on.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
# The dev venv lives at the repository root (see the Makefile).
venvPath = ".."
venv = ".venv"
